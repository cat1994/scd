[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scd-experiments"
version = "0.1.0"
description = "Reproduction package for SCD fixed-tournament experiments"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<2", "pandas>=1.5.3,<3", "matplotlib>=3.7,<4"]

[tool.setuptools]
packages = ["hr_edl_data", "bin"]
